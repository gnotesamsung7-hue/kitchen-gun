plugins {
    id 'com.android.application'
}

android {
    namespace 'com.markdave.kitchengun'
    compileSdk 34

    defaultConfig {
        applicationId "com.markdave.kitchengun"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            storeFile file('kitchengun.jks')
            storePassword 'kitchengun'
            keyAlias 'kitchengun'
            keyPassword 'kitchengun'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
